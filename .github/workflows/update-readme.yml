name: Auto-Update README on Release

on:
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Update README with Latest Release
        run: |
          chmod +x scripts/update_readme_downloads.py
          python3 scripts/update_readme_downloads.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status -s README.md version.json) ]]; then
            git add README.md version.json
            git commit -m "docs: auto-update release download links and badges [skip ci]"
            git push origin main
          else
            echo "No README changes detected."
          fi
